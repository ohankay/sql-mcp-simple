name: Windows bundle

# Tests the committed download package release/sql-mcp-simple-windows-x64.zip on real Windows:
# offline install with install.cmd on every supported Python, MCP stdio smoke test, and Windows
# authentication against SQL Server Express. Rebuild the zip with: python scripts/build_bundle.py

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["release/**", "bundle/**", "scripts/build_bundle.py", ".github/workflows/bundle.yml"]

jobs:
  freshness:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The zip must contain the current source
        shell: python
        run: |
          import io, pathlib, sys, zipfile
          norm = lambda b: b.replace(b"\r\n", b"\n")
          outer = zipfile.ZipFile("release/sql-mcp-simple-windows-x64.zip")
          names = outer.namelist()
          stale = []
          for f in ("install.cmd", "KURULUM_REHBERI.md"):
              if norm(outer.read(f"sql-mcp-simple/{f}")) != norm(pathlib.Path("bundle", f).read_bytes()):
                  stale.append(f)
          whl = next(n for n in names if n.startswith("sql-mcp-simple/wheelhouse/sql_mcp_simple-"))
          inner = zipfile.ZipFile(io.BytesIO(outer.read(whl)))
          for src in pathlib.Path("src/sql_mcp").glob("*.py"):
              if norm(inner.read(f"sql_mcp/{src.name}")) != norm(src.read_bytes()):
                  stale.append(str(src))
          if stale:
              sys.exit("zip is stale, run scripts/build_bundle.py: " + ", ".join(stale))
          print("zip is up to date")

  install-test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unzip
        shell: pwsh
        run: Expand-Archive release\sql-mcp-simple-windows-x64.zip -DestinationPath C:\bundle
      - name: Offline install with install.cmd (no network to PyPI)
        shell: cmd
        env:
          SQL_MCP_HOME: C:\sqlmcp
          SQL_MCP_PYTHON: python
          PIP_INDEX_URL: http://127.0.0.1:9/blocked
        run: |
          cd /d C:\bundle\sql-mcp-simple
          call install.cmd
          if errorlevel 1 exit /b 1
      - name: Smoke test (CLI + MCP stdio handshake)
        shell: pwsh
        run: |
          & C:\sqlmcp\Scripts\sql-mcp.exe --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & C:\sqlmcp\Scripts\sql-mcp.exe --check | Out-String | Write-Output
          if ($LASTEXITCODE -ne 1) { Write-Error "--check without config must exit 1"; exit 1 }
          @'
          import asyncio, json
          from mcp import ClientSession, StdioServerParameters
          from mcp.client.stdio import stdio_client

          async def main():
              params = StdioServerParameters(command=r"C:\sqlmcp\Scripts\sql-mcp.exe", args=[])
              async with stdio_client(params) as (r, w), ClientSession(r, w) as s:
                  await s.initialize()
                  tools = {t.name for t in (await s.list_tools()).tools}
                  assert len(tools) == 30, tools
                  res = json.loads((await s.call_tool("execute_sql", {"sql": "SELECT 1"})).content[0].text)
                  assert res["success"] is False and "SQL_MCP_SERVER" in res["errors"][0]["message"], res
              print("stdio OK,", len(tools), "tools")

          asyncio.run(main())
          '@ | Set-Content smoke.py
          & C:\sqlmcp\Scripts\python.exe smoke.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $v = & C:\sqlmcp\Scripts\python.exe -c "import sys; print('%d.%d' % sys.version_info[:2])"
          if ($v -ne "${{ matrix.python }}") { Write-Error "venv uses Python $v, expected ${{ matrix.python }}"; exit 1 }

  windows-auth-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SQL Server Express
        shell: pwsh
        run: |
          choco install sql-server-express -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Install bundle
        shell: cmd
        env:
          SQL_MCP_HOME: C:\sqlmcp
        run: |
          powershell -Command "Expand-Archive release\sql-mcp-simple-windows-x64.zip -DestinationPath C:\bundle"
          cd /d C:\bundle\sql-mcp-simple
          call install.cmd
          if errorlevel 1 exit /b 1
      - name: Windows authentication - all drivers
        shell: pwsh
        run: |
          $env:SQL_MCP_SERVER = "localhost\SQLEXPRESS"
          $env:SQL_MCP_AUTH = "windows"
          foreach ($drv in @("auto", "mssql-python", "pyodbc")) {
            $env:SQL_MCP_DRIVER = $drv
            $out = & C:\sqlmcp\Scripts\sql-mcp.exe --check | Out-String
            Write-Output "== driver=$drv =="; Write-Output $out
            if ($LASTEXITCODE -ne 0) { Write-Error "Windows auth failed with driver $drv"; exit 1 }
            $info = ($out | ConvertFrom-Json).connections.default.server
            if ($info.auth_scheme -notin @("NTLM", "KERBEROS")) { Write-Error "unexpected auth_scheme $($info.auth_scheme)"; exit 1 }
          }
